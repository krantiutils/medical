# .github/workflows/docker-deploy.yml
name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy (ARM)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /home/ubuntu/doctorsewa-src
            git pull origin main
            docker build -t doctorsewa:latest \
              --build-arg NEXT_PUBLIC_SITE_URL=https://doctorsewa.org \
              --build-arg NEXT_PUBLIC_BASE_DOMAIN=doctorsewa.org .
            cd /home/ubuntu/doctorsewa
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
